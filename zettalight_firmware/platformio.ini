[env:upesy_wroom]
; Official platform espressif32 7.1.3 still resolves Arduino-ESP32 2.0.17.
; 55.03.312-1 packages Arduino-ESP32 3.3.12 (ESP-IDF 5.5.5) with the WebServer security fixes.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = upesy_wroom
framework = arduino
lib_deps = 
	dfrobot/DFRobot_I2C_Multiplexer@^1.0.2
	adafruit/Adafruit TSL2591 Library@^1.4.3
	tobiasschuerg/ESP8266 Influxdb@^3.13.1
	bblanchon/ArduinoJson@^6.21.6
	milesburton/DallasTemperature@^3.11.0
